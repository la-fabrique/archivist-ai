[project]
name = "notes-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
]

[project.scripts]
notes = "notes_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
