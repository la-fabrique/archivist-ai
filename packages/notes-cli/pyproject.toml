[project]
name = "notes-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cli-core",
    "click>=8.1.0",
]

[project.scripts]
notes = "notes_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notes_cli"]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
]

[tool.uv.sources]
cli-core = { path = "../cli-core", editable = true }
