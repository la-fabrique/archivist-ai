name: CI — cli-core

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli-core/**'
      - '.github/workflows/ci-cli-core.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli-core/**'
      - '.github/workflows/ci-cli-core.yml'

jobs:
  tests:
    name: Tests cli-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: packages/cli-core

      - name: Run tests
        run: uv run pytest tests/ -v
        working-directory: packages/cli-core
