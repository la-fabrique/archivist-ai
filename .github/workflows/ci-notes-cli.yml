name: CI — notes-cli

on:
  push:
    branches: [main]
    paths:
      - 'packages/notes-cli/**'
      - 'packages/cli-core/**'
      - '.github/workflows/ci-notes-cli.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/notes-cli/**'
      - 'packages/cli-core/**'
      - '.github/workflows/ci-notes-cli.yml'

jobs:
  tests:
    name: Tests notes-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked
        working-directory: packages/notes-cli

      - name: Run tests
        run: uv run pytest tests/ -v
        working-directory: packages/notes-cli
